<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Activity Logger</title>
<style>
:root{--bg:#f2f4f6;--ink:#14202b;--mute:#5d6b78;--card:#fff;--line:#d5dbe1;--ok:#0f766e;--dec:#2f5fb3;--bad:#c62828;--badbg:#fdeceb}
@media(prefers-color-scheme:dark){:root{--bg:#10171d;--ink:#e6ecf1;--mute:#93a1ad;--card:#18222b;--line:#2c3a46;--ok:#3fb8aa;--dec:#7aa2ec;--bad:#ff6b66;--badbg:#2b1a1b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
header{padding:28px 20px 12px;max-width:820px;margin:auto}h1{margin:0;font-size:26px;letter-spacing:-.3px}
header p{margin:4px 0 0;color:var(--mute)}
.bar{max-width:820px;margin:auto;padding:8px 20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
select,button{font:inherit;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}
button:focus-visible,select:focus-visible,.card:focus-visible{outline:2px solid var(--dec);outline-offset:2px}
#verdict{font-weight:600}.good{color:var(--ok)}.evil{color:var(--bad)}
.sum{max-width:820px;margin:auto;padding:0 20px;color:var(--mute)}
main{max-width:820px;margin:12px auto 60px;padding:0 20px 0 44px;position:relative}
main:before{content:"";position:absolute;left:30px;top:0;bottom:0;width:2px;background:var(--line)}
.ev{position:relative;margin:0 0 14px}.dot{position:absolute;left:-21px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px var(--bg)}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;padding:12px 14px;cursor:pointer}
.ev.high .card{background:var(--badbg)}
.top{display:flex;justify-content:space-between;gap:10px;font-weight:600}.time{color:var(--mute);font-weight:400;font-size:13px;white-space:nowrap}
.why{margin:4px 0 0}.tag{font-size:12px;color:var(--c);font-weight:600}
.more{display:none;margin-top:10px}.open .more{display:block}
pre{margin:4px 0 8px;padding:8px 10px;background:var(--bg);border-radius:6px;font:12.5px/1.45 Consolas,monospace;white-space:pre-wrap;word-break:break-word}
.empty{color:var(--mute);padding:20px 0}
</style></head><body>
<header><h1>Agent Activity Logger</h1><p>What the agent did, and why, in order.</p></header>
<div class="bar">
 <select id="sess" aria-label="Session"></select>
 <select id="flt" aria-label="Filter"><option value="all">All events</option><option value="high">High risk only</option><option value="tool_call">Tool calls only</option></select>
 <button id="ver">Verify log integrity</button><span id="verdict"></span>
</div>
<div class="sum" id="sum"></div>
<main id="tl"></main>
<script>
const $=id=>document.getElementById(id);
const COL={user_task:"var(--mute)",decision:"var(--dec)",tool_call:"var(--ok)",final:"var(--ink)"};
const NAME={user_task:"User task",decision:"Decision",tool_call:"Tool call",final:"Final answer"};
let ev=[];
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function render(){
  const f=$("flt").value, tl=$("tl"); tl.replaceChildren();
  const list=ev.filter(e=>f==="all"||(f==="high"?e.risk==="high":e.type===f));
  if(!list.length) tl.append(el("div","empty","No events yet. Run `python real_agent.py normal` first."));
  const t0=ev.length?ev[0].ts:0;
  list.forEach(e=>{
    const w=el("div","ev"+(e.risk==="high"?" high":"")); w.style.setProperty("--c",e.risk==="high"?"var(--bad)":COL[e.type]);
    w.append(el("div","dot"));
    const c=el("div","card"); c.tabIndex=0;
    const top=el("div","top"); top.append(el("span","",(e.tool?NAME[e.type]+": "+e.tool:NAME[e.type])), el("span","time","+"+(e.ts-t0).toFixed(2)+"s"));
    c.append(top);
    if(e.risk==="high") c.append(el("div","tag","ALERT: "+e.alert));
    c.append(el("p","why","Why: "+(e.reason||"-")));
    const m=el("div","more");
    [["Input",e.input],["Output",e.output],["Hash",e.hash.slice(0,24)+"..."]].forEach(([k,v])=>{if(v&&v!=="null"&&v!=="\"\"")m.append(el("div","tag",k),el("pre","",v))});
    c.append(m); const tog=()=>w.classList.toggle("open");
    c.onclick=tog; c.onkeydown=k=>{if(k.key==="Enter"||k.key===" "){k.preventDefault();tog()}};
    w.append(c); tl.append(w);
  });
  const h=ev.filter(e=>e.risk==="high").length;
  $("sum").textContent=ev.length+" events, "+h+" high risk";
}
async function load(){ev=await (await fetch("/api/events/"+$("sess").value)).json();render()}
async function init(){
  const s=await (await fetch("/api/sessions")).json();
  s.forEach(x=>{const o=el("option","",x.session_id+" ("+x.n+" events"+(x.h?", "+x.h+" high risk":"")+")");o.value=x.session_id;$("sess").append(o)});
  if(s.length) load(); else render();
}
$("sess").onchange=load; $("flt").onchange=render;
$("ver").onclick=async()=>{const r=await (await fetch("/api/verify")).json(),v=$("verdict");
  v.className=r.ok?"good":"evil"; v.textContent=r.ok?"Log chain is intact. No tampering detected.":"TAMPERING detected! Row id "+r.bad_id+" was modified"};
init();
</script></body></html>
